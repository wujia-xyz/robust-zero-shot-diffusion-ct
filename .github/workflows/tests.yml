name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: >-
          python -m pytest
          --ignore=tests/test_axial.py
          --ignore=tests/test_triplet.py

  axial-triplet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full method core
        run: |
          python -m pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,axial]"
      - name: Test full method core
        run: python -m pytest
      - name: Validate public release
        run: python scripts/validate_release.py
